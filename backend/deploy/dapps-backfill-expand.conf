# Install as /etc/systemd/system/dapps-backfill.service.d/expansion.conf
# only after reviewing the passed epoch-664 validation and load report.
[Unit]
Description=Validated Cardano historical expansion: epochs 663 through 659

[Service]
ExecStart=
ExecStart=/usr/bin/python3 -u -m analytics.backfill --root /mnt/cardano-data/dapps-analytics/history --epochs 663 662 661 660 659 --rate 100
